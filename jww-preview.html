<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ぷろろん JWW確認</title><style>body{font:16px -apple-system,sans-serif;background:#f4f6f8;color:#172033;margin:16px}section{background:white;border-radius:14px;padding:16px;margin-bottom:14px}button,input{font:inherit;min-height:48px;max-width:100%}button{padding:12px;border:0;border-radius:10px;background:#0f62fe;color:white;margin:8px 0}canvas{width:100%;background:white;border:1px solid #cbd5e1;touch-action:pan-y}p{line-height:1.6;overflow-wrap:anywhere}small{color:#475569}</style><h1>ぷろろん JWW確認</h1><section><p>確認用ページです。本体の見積データは変更しません。初回は通信して、固定バージョンのKAKUから解析処理だけを取得します。図面ファイルは送信しません。</p><input id="file" type="file" accept=".jww" disabled><p id="status" role="status">解析エンジン準備中…</p><button id="retry">エンジンを再読込</button></section><section><canvas id="cv" width="1000" height="750"></canvas><button id="measure">計測OFF</button><p id="result">実寸は既知寸法と照合してください。部屋抽出・解体・器具配置は未実装です。</p></section><small>AI名：Perplexity／JWW解析：提供されたKAKUの実装を利用。実ファイルでの動作確認は未実施。</small><script>let parse,geo,transform,points=[],on=false,serial=0;const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');async function init(){ $('file').disabled=true;$('status').textContent='解析エンジン取得中…';try{const r=await fetch('https://raw.githubusercontent.com/katsu1007/kaku-estimate/763b73d69dbdb15431c283cab8dfe6176351d413/index.html');if(!r.ok)throw Error('HTTP '+r.status);const source=await r.text(),b=source.match(/[A-Za-z0-9+/=]{100000,}/);if(!b)throw Error('埋め込みエンジンが見つかりません');const text=new TextDecoder().decode(Uint8Array.from(atob(b[0]),c=>c.charCodeAt(0))),a=text.indexOf('function solidEdges('),d=text.indexOf('function jwwRead('),e=text.indexOf('function jwwTexts(',d);if(a<0||d<a||e<d)throw Error('解析処理の構造が想定と異なります');parse=new Function(text.slice(a,e)+';return jwwGeom;')();$('file').disabled=false;$('status').textContent='準備完了。JWWファイルを選んでください。'}catch(e){$('status').textContent='準備失敗：'+e.message+'。再読込してください。'}}function draw(){ctx.clearRect(0,0,1000,750);transform=null;if(!geo)return;let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;geo.segs.forEach(s=>{x0=Math.min(x0,s[1],s[3]);x1=Math.max(x1,s[1],s[3]);y0=Math.min(y0,s[2],s[4]);y1=Math.max(y1,s[2],s[4]);});if(!isFinite(x0))return;const k=Math.min(920/(x1-x0||1),670/(y1-y0||1)),ox=500-(x0+x1)*k/2,oy=375+(y0+y1)*k/2;transform={k,ox,oy};ctx.strokeStyle='#172033';ctx.lineWidth=1;ctx.beginPath();geo.segs.forEach(s=>{ctx.moveTo(ox+s[1]*k,oy-s[2]*k);ctx.lineTo(ox+s[3]*k,oy-s[4]*k)});ctx.stroke();ctx.fillStyle='#1749a5';ctx.font='12px sans-serif';geo.texts.forEach(t=>ctx.fillText(t.t,ox+t.x*k,oy-t.y*k));ctx.strokeStyle='#dc2626';ctx.fillStyle='#dc2626';points.forEach(p=>{ctx.beginPath();ctx.arc(ox+p[0]*k,oy-p[1]*k,6,0,Math.PI*2);ctx.fill()});if(points.length===2){ctx.beginPath();ctx.moveTo(ox+points[0][0]*k,oy-points[0][1]*k);ctx.lineTo(ox+points[1][0]*k,oy-points[1][1]*k);ctx.stroke()}}$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const token=++serial;geo=null;points=[];draw();$('result').textContent='未計測';if(f.size>30*1024*1024){$('status').textContent='30MBを超えるため読み込みを中止しました';return}$('status').textContent='解析中…';try{const buf=await f.arrayBuffer();if(token!==serial)return;const g=parse(buf);g.segs=g.segs.filter(s=>s.slice(1,5).every(Number.isFinite));if(!g.segs.length)throw Error('表示できる線分がありません');geo=g;draw();$('status').textContent=f.name+'：線分等 '+g.segs.length+'／文字 '+g.texts.length+'／採用縮尺 1:'+g.scale+(g.listErr?'／警告：ブロック定義の一部を読み取れませんでした':'')+'。縮尺の異なるグループや非表示レイヤーはKAKUの処理に従って除外される場合があります。';}catch(e){$('status').textContent='読込失敗：'+e.message;}};$('measure').onclick=()=>{on=!on;points=[];$('measure').textContent=on?'計測ON':'計測OFF';$('result').textContent=on?'始点をタップしてください（指位置での概算。吸着なし）':'計測停止';draw()};cv.onclick=e=>{if(!on||!transform)return;const r=cv.getBoundingClientRect(),{k,ox,oy}=transform,p=[((e.clientX-r.left)*1000/r.width-ox)/k,(oy-(e.clientY-r.top)*750/r.height)/k];if(points.length===2)points=[];points.push(p);$('result').textContent=points.length===1?'終点をタップしてください':'約 '+(Math.hypot(points[1][0]-points[0][0],points[1][1]-points[0][1])/1000).toFixed(3)+' m（読み込んだ縮尺に基づく概算・既知寸法で要照合）';draw()};$('retry').onclick=init;init();</script></html>
