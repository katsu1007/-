<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ぷろろん JWW確認・吸着</title><style>body{font:16px -apple-system,sans-serif;background:#f4f6f8;color:#172033;margin:16px}section{background:white;border-radius:14px;padding:16px;margin-bottom:14px}button,input{font:inherit;min-height:48px;max-width:100%}button{padding:12px;border:0;border-radius:10px;background:#0f62fe;color:white;margin:8px 4px 8px 0}canvas{width:100%;background:white;border:1px solid #cbd5e1;touch-action:pan-y}p{line-height:1.6;overflow-wrap:anywhere}small{color:#475569}.off{background:#475569}</style><h1>ぷろろん JWW確認</h1><section><p>吸着対応版 v2。本体の見積データは変更しません。固定バージョンのKAKUから解析処理を取得します。図面ファイルは送信しません。</p><input id="file" type="file" accept=".jww" disabled><p id="status" role="status">解析エンジン準備中…</p><button id="retry">エンジンを再読込</button></section><section><canvas id="cv" width="1000" height="750"></canvas><button id="measure">計測OFF</button><button id="snap" aria-pressed="true">吸着ON</button><button id="reset">計測クリア</button><p id="kind" role="status">端点 → 交点 → 線上の順に吸着（直線のみ）</p><p id="result">実寸は既知寸法と照合してください。部屋抽出・解体・器具配置は未実装です。</p></section><small>AI名：Perplexity／JWW解析：KAKU。吸着範囲は画面上24px。円弧の分割点は吸着対象外。更新版のiPhone実機動作は未確認。</small><script>let parse,geo,transform,points=[],on=false,snapOn=true,serial=0;const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');async function init(){$('file').disabled=true;$('status').textContent='解析エンジン取得中…';try{const r=await fetch('https://raw.githubusercontent.com/katsu1007/kaku-estimate/763b73d69dbdb15431c283cab8dfe6176351d413/index.html');if(!r.ok)throw Error('HTTP '+r.status);const source=await r.text(),b=source.match(/[A-Za-z0-9+/=]{100000,}/);if(!b)throw Error('埋め込みエンジンが見つかりません');const text=new TextDecoder().decode(Uint8Array.from(atob(b[0]),c=>c.charCodeAt(0))),a=text.indexOf('function solidEdges('),d=text.indexOf('function jwwRead('),e=text.indexOf('function jwwTexts(',d);if(a<0||d<a||e<d)throw Error('解析処理の構造が想定と異なります');let core=text.slice(a,e);const from='segs.push(ai==null?[ly,q[0],q[1],r[0],r[1],col,o.width]:',to='segs.push(ai==null?[ly,q[0],q[1],r[0],r[1],col,o.width,-1]:';if(!core.includes(from))throw Error('円弧識別処理の構造が想定と異なります');core=core.replace(from,to);parse=new Function(core+';return jwwGeom;')();$('file').disabled=false;$('status').textContent='準備完了。JWWファイルを選んでください。'}catch(e){$('status').textContent='準備失敗：'+e.message+'。再読込してください。'}}function draw(){ctx.clearRect(0,0,1000,750);transform=null;if(!geo)return;let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;geo.segs.forEach(s=>{x0=Math.min(x0,s[1],s[3]);x1=Math.max(x1,s[1],s[3]);y0=Math.min(y0,s[2],s[4]);y1=Math.max(y1,s[2],s[4]);});if(!isFinite(x0))return;const k=Math.min(920/(x1-x0||1),670/(y1-y0||1)),ox=500-(x0+x1)*k/2,oy=375+(y0+y1)*k/2;transform={k,ox,oy};ctx.strokeStyle='#172033';ctx.lineWidth=1;ctx.beginPath();geo.segs.forEach(s=>{ctx.moveTo(ox+s[1]*k,oy-s[2]*k);ctx.lineTo(ox+s[3]*k,oy-s[4]*k)});ctx.stroke();ctx.fillStyle='#1749a5';ctx.font='12px sans-serif';geo.texts.forEach(t=>ctx.fillText(t.t,ox+t.x*k,oy-t.y*k));const size=9*1000/(cv.getBoundingClientRect().width||1000);ctx.strokeStyle='#dc2626';ctx.lineWidth=2;points.forEach(p=>{const x=ox+p[0]*k,y=oy-p[1]*k;ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(x-size*1.5,y);ctx.lineTo(x+size*1.5,y);ctx.moveTo(x,y-size*1.5);ctx.lineTo(x,y+size*1.5);ctx.stroke()});if(points.length===2){ctx.beginPath();ctx.moveTo(ox+points[0][0]*k,oy-points[0][1]*k);ctx.lineTo(ox+points[1][0]*k,oy-points[1][1]*k);ctx.stroke()}}function snapAt(p,segs,r){let best=null;const offer=(q,type,rank)=>{const d=Math.hypot(q[0]-p[0],q[1]-p[1]);if(d<=r&&(!best||rank<best.rank||rank===best.rank&&d<best.d))best={p:q,type,rank,d}};const near=[];for(const s of segs){if(s.length>7)continue;const a=[s[1],s[2]],b=[s[3],s[4]],dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;if(!L)continue;const t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L)),q=[a[0]+t*dx,a[1]+t*dy];offer(a,'端点',0);offer(b,'端点',0);offer(q,'線上',2);if(Math.hypot(q[0]-p[0],q[1]-p[1])<=r)near.push({a,b,dx,dy})}for(let i=0;i<near.length;i++)for(let j=i+1;j<near.length;j++){const a=near[i],b=near[j],den=a.dx*b.dy-a.dy*b.dx;if(Math.abs(den)<=1e-10*Math.hypot(a.dx,a.dy)*Math.hypot(b.dx,b.dy))continue;const x=b.a[0]-a.a[0],y=b.a[1]-a.a[1],t=(x*b.dy-y*b.dx)/den,u=(x*a.dy-y*a.dx)/den;if(t>=0&&t<=1&&u>=0&&u<=1)offer([a.a[0]+t*a.dx,a.a[1]+t*a.dy],'交点',1)}return best||{p,type:'自由点',rank:3,d:0}}$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const token=++serial;geo=null;points=[];draw();$('result').textContent='未計測';$('kind').textContent='未選択';if(f.size>30*1024*1024){$('status').textContent='30MBを超えるため読み込みを中止しました';return}$('status').textContent='解析中…';try{const buf=await f.arrayBuffer();if(token!==serial)return;const g=parse(buf);g.segs=g.segs.filter(s=>s.slice(1,5).every(Number.isFinite));if(!g.segs.length)throw Error('表示できる線分がありません');geo=g;draw();$('status').textContent=f.name+'：線分等 '+g.segs.length+'／文字 '+g.texts.length+'／採用縮尺 1:'+g.scale+(g.listErr?'／警告：ブロック定義の一部を読み取れませんでした':'')+'。異縮尺グループや非表示レイヤーはKAKUの処理に従い除外される場合があります。';}catch(e){geo=null;draw();$('status').textContent='読込失敗：'+e.message;}};$('measure').onclick=()=>{on=!on;points=[];$('measure').textContent=on?'計測ON':'計測OFF';$('measure').setAttribute('aria-pressed',String(on));$('result').textContent=on?'始点をタップしてください':'計測停止';$('kind').textContent='未選択';draw()};$('snap').onclick=()=>{snapOn=!snapOn;$('snap').textContent=snapOn?'吸着ON':'吸着OFF';$('snap').classList.toggle('off',!snapOn);$('snap').setAttribute('aria-pressed',String(snapOn));$('kind').textContent=snapOn?'端点 → 交点 → 線上の順に吸着':'指の位置をそのまま使用（自由点）'};$('reset').onclick=()=>{points=[];$('result').textContent=on?'始点をタップしてください':'計測停止';$('kind').textContent='未選択';draw()};cv.onclick=e=>{if(!on||!transform)return;const r=cv.getBoundingClientRect(),{k,ox,oy}=transform,p=[((e.clientX-r.left)*1000/r.width-ox)/k,(oy-(e.clientY-r.top)*750/r.height)/k],hit=snapOn?snapAt(p,geo.segs,24*1000/r.width/k):{p,type:'自由点'};if(points.length===2)points=[];points.push(hit.p);$('kind').textContent=(points.length===1?'始点：':'終点：')+hit.type+(snapOn&&hit.type==='自由点'?'（範囲内に吸着候補なし）':'');$('result').textContent=points.length===1?'始点を設定しました。終点をタップしてください':'約 '+(Math.hypot(points[1][0]-points[0][0],points[1][1]-points[0][1])/1000).toFixed(3)+' m（読込縮尺に基づく値・既知寸法で要照合）';draw()};$('retry').onclick=init;init();</script></html>
